# https://www.playframework.com/documentation/latest/ConfigFile

play.http.secret.key = "dv01-loan-stats-assessment-secret-not-for-production"

play.i18n {
  langs = [ "en" ]
}

play.assets {
  path = "/public"
  urlPrefix = "/assets"
}

# Allow local development hosts (Play AllowedHostsFilter)
play.filters.hosts {
  allowed = ["localhost", "localhost:9000", "127.0.0.1", "127.0.0.1:9000"]
}

# Lending Club tape path (override with -Dloan.csv.path=... or LOAN_CSV)
loan.csv.path = "data/sample.csv"
loan.csv.path = ${?LOAN_CSV}
